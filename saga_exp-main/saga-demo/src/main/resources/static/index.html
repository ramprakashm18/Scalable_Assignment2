<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Saga Demo</title>
<style>
  body { font-family: Arial, sans-serif; background:#f6f8fb; margin:0; }
  header { background:#1f4e79; color:#fff; padding:24px 40px; }
  main { padding:24px 40px; }
  .card { background:#fff; border:1px solid #dde3ea; border-radius:8px; padding:16px 20px; margin-bottom:20px; }
  input { padding:8px; margin-right:10px; width:120px; }
  button { padding:8px 16px; background:#1f4e79; color:#fff; border:none; border-radius:6px; cursor:pointer; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid #eee; }
  th { background:#1f4e79; color:#fff; }
</style>
</head>
<body>
<header>
  <h1>Order &ndash; Payment &ndash; Inventory Saga</h1>
  <p>Create Order &rarr; Make Payment &rarr; Reserve Inventory &rarr; Confirm Order</p>
</header>
<main>
  <div class="card">
    <h3>Place an order</h3>
    <input id="productId" placeholder="Product ID" value="101">
    <input id="quantity" placeholder="Quantity" value="1">
    <input id="amount" placeholder="Amount" value="1500">
    <button onclick="placeOrder()">Place Order</button>
    <p id="result"></p>
  </div>
  <div class="card">
    <h3>Orders</h3>
    <table id="ordersTable">
      <thead><tr><th>ID</th><th>Product</th><th>Quantity</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script>
async function placeOrder() {
  const productId = document.getElementById('productId').value;
  const quantity = document.getElementById('quantity').value;
  const amount = document.getElementById('amount').value;
  const res = await fetch('/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ productId: Number(productId), quantity: Number(quantity), amount: Number(amount) })
  });
  const order = await res.json();
  document.getElementById('result').innerText = 'Result: ' + order.status;
  loadOrders();
}

async function loadOrders() {
  const res = await fetch('/api/orders');
  const orders = await res.json();
  const tbody = document.querySelector('#ordersTable tbody');
  tbody.innerHTML = orders.map(o =>
    `<tr><td>${o.id}</td><td>${o.productId}</td><td>${o.quantity}</td><td>${o.amount}</td><td>${o.status}</td></tr>`
  ).join('');
}

loadOrders();
</script>
</body>
</html>
